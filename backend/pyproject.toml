[project]
name = "sferaai-backend"
version = "1.0.0"
description = "API Backend para SferaAI - Call Center con IA y Compliance Legal"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "SferaAI Team" }
]
keywords = ["fastapi", "api", "call-center", "ai", "gdpr", "compliance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

dependencies = [
    "fastapi~=0.115.0",
    "uvicorn[standard]~=0.32.0",
    "pydantic~=2.10.0",
    "pydantic-settings~=2.6.0",
    "sqlalchemy[asyncio]~=2.0.36",
    "asyncpg~=0.30.0",
    "python-jose[cryptography]~=3.3.0",
    "passlib[bcrypt]~=1.7.4",
    "python-multipart~=0.0.17",
    "httpx~=0.28.0",
    "tenacity~=9.0.0",
    "structlog~=24.4.0",
    "weasyprint~=62.0",
    "jinja2~=3.1.0",
    "alembic~=1.14.0",
    "arq~=0.26.0",
    "redis[hiredis]~=5.2.0",
    "boto3~=1.35.0",
    "openpyxl~=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["alembic/versions/*.py"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    # FastAPI dependency injection — args appear in signature but not body
    "ARG001",
    "ARG002",
    "ARG004",
    "ARG005",
    # raise from err — widespread pattern, deferred cleanup
    "B904",
    # conditional imports (e.g. lazy optional deps)
    "E402",
    # equality to True in SQLAlchemy column comparisons
    "E712",
    # loop control variable unused
    "B007",
    # assert bare Exception in tests
    "B017",
    # loop variable not bound in closures — legacy tasks
    "B023",
    # str+Enum pattern (StrEnum migration deferred)
    "UP042",
    # simplify suggestions — stylistic, deferred
    "SIM102",
    "SIM103",
    "SIM105",
    "SIM108",
    "SIM110",
    "SIM116",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
