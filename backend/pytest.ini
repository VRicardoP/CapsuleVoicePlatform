[pytest]
# =============================================================================
# SferaAI Backend - Pytest Configuration
# =============================================================================

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async mode for pytest-asyncio
asyncio_mode = auto

# Default options
addopts =
    --strict-markers
    --tb=short
    -ra

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests requiring database connection
    unit: marks unit tests (no external dependencies)
    gdpr: marks GDPR compliance tests
    robinson: marks Robinson list compliance tests
    auth: marks authentication tests
    audit: marks audit log tests

# Logging
log_cli = true
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout for async tests (seconds)
asyncio_default_fixture_loop_scope = function

# Minimum coverage
# To run with coverage: pytest --cov=app --cov-report=html
