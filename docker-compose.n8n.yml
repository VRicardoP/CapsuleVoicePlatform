version: '3.8'

# ============================================================================
# n8n - Workflow Automation para CapsuleCorp
# ============================================================================
# Este archivo es específico de la rama retell-n8n
# Para Make.com, usar la rama retell-ai
# ============================================================================

services:
  n8n:
    image: n8nio/n8n:2.6.4
    container_name: capsulecorp-n8n
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    ports:
      - "5678:5678"
    environment:
      # ─────────────────────────────────────────────────────────────────────
      # Configuración básica
      # ─────────────────────────────────────────────────────────────────────
      - N8N_HOST=${N8N_HOST:-n8n.localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-https}
      - NODE_ENV=production

      # URL base para webhooks (IMPORTANTE: debe coincidir con el dominio público)
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-https://n8n.tudominio.com/}

      # ─────────────────────────────────────────────────────────────────────
      # Zona horaria
      # ─────────────────────────────────────────────────────────────────────
      - GENERIC_TIMEZONE=Europe/Madrid
      - TZ=Europe/Madrid

      # ─────────────────────────────────────────────────────────────────────
      # Seguridad
      # ─────────────────────────────────────────────────────────────────────
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:?N8N_BASIC_AUTH_PASSWORD is required}

      # Clave de encriptación para credenciales (OBLIGATORIO en producción)
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}

      # ─────────────────────────────────────────────────────────────────────
      # Base de datos
      # ─────────────────────────────────────────────────────────────────────
      # Opción A: SQLite (default, más simple)
      - DB_TYPE=sqlite
      - DB_SQLITE_DATABASE=/home/node/.n8n/database.sqlite

      # Opción B: PostgreSQL (descomentar para usar la misma BD que CapsuleCorp)
      # - DB_TYPE=postgresdb
      # - DB_POSTGRESDB_HOST=${POSTGRES_HOST:-postgres}
      # - DB_POSTGRESDB_PORT=${POSTGRES_PORT:-5432}
      # - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME:-n8n}
      # - DB_POSTGRESDB_USER=${POSTGRES_USER:-capsulecorp}
      # - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      # - DB_POSTGRESDB_SCHEMA=n8n

      # ─────────────────────────────────────────────────────────────────────
      # Ejecución
      # ─────────────────────────────────────────────────────────────────────
      # Permitir módulos externos en nodos de código
      - NODE_FUNCTION_ALLOW_EXTERNAL=*

      # Número de ejecuciones a mantener en historial (0 = ilimitado)
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168  # 7 días en horas

      # ─────────────────────────────────────────────────────────────────────
      # Logs
      # ─────────────────────────────────────────────────────────────────────
      - N8N_LOG_LEVEL=info
      - N8N_LOG_OUTPUT=console

    volumes:
      # Datos persistentes de n8n
      - n8n_data:/home/node/.n8n
      # Directorio para archivos (adjuntos, exports, etc.)
      - n8n_files:/files

    networks:
      - capsulecorp-network

    labels:
      # ─────────────────────────────────────────────────────────────────────
      # Traefik labels (si usas Traefik como reverse proxy)
      # ─────────────────────────────────────────────────────────────────────
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`${N8N_HOST:-n8n.localhost}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=letsencrypt"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
      # Headers de seguridad
      - "traefik.http.middlewares.n8n-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.n8n-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.routers.n8n.middlewares=n8n-headers"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# ─────────────────────────────────────────────────────────────────────────────
# Volúmenes
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  n8n_data:
    driver: local
  n8n_files:
    driver: local

# ─────────────────────────────────────────────────────────────────────────────
# Redes
# ─────────────────────────────────────────────────────────────────────────────
networks:
  capsulecorp-network:
    external: true
    name: ${DOCKER_NETWORK:-capsulecorp-network}
